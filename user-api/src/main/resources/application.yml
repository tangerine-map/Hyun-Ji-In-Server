spring:
  application:
    name: hyunjiin-user-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/hyunjiin}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

openapi:
  server-url: ${OPENAPI_SERVER_URL:}

tour-api:
  base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
  mobile-os: ${TOUR_API_MOBILE_OS:ETC}
  mobile-app: ${TOUR_API_MOBILE_APP:hyunjiin}
  area-code: ${TOUR_API_AREA_CODE:39}
  content-type-id: ${TOUR_API_CONTENT_TYPE_ID:39}

restaurant-enrichment:
  max-sources-per-restaurant: ${RESTAURANT_ENRICHMENT_MAX_SOURCES:5}
  parallelism: ${RESTAURANT_ENRICHMENT_PARALLELISM:3}
  crawler-base-url: ${RESTAURANT_ENRICHMENT_CRAWLER_BASE_URL:http://localhost:8001}
