name: Server CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  USER_API_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/hyunjiin-user-api
  CRAWLER_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/hyunjiin-crawler

jobs:
  verify:
    name: Verify server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile and test user API
        run: ./gradlew :user-api:compileJava :user-api:test --no-daemon

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/pyproject.toml

      - name: Install crawler test dependencies
        run: python -m pip install -e './crawler[test]'

      - name: Test crawler
        run: python -m pytest crawler/tests -q

  publish-image:
    name: Publish user API image
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract user API image metadata
        id: user-api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.USER_API_IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push user API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.user-api-meta.outputs.tags }}
          labels: ${{ steps.user-api-meta.outputs.labels }}

      - name: Extract crawler image metadata
        id: crawler-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CRAWLER_IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push crawler image
        uses: docker/build-push-action@v6
        with:
          context: ./crawler
          file: ./crawler/Dockerfile
          push: true
          tags: ${{ steps.crawler-meta.outputs.tags }}
          labels: ${{ steps.crawler-meta.outputs.labels }}

      - name: Checkout manifest repository
        uses: actions/checkout@v4
        with:
          repository: tangerine-map/Hyun-Ji-In-Manifest
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}
          path: manifest

      - name: Update manifest image tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          KUSTOMIZATION="manifest/apps/hyunjiin-user-api/overlays/prod/kustomization.yaml"
          sed -i "s/^\([[:space:]]*newTag:\).*/\1 ${SHORT_SHA}/" "${KUSTOMIZATION}"

      - name: Push manifest update
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          cd manifest
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/hyunjiin-user-api/overlays/prod/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Manifest already points to ${SHORT_SHA}."
            exit 0
          fi
          git commit -m "Deploy user API ${SHORT_SHA}"
          git push
