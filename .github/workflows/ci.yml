name: Server CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/hyunjiin-user-api

jobs:
  verify:
    name: Verify server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Compile and test user API
        run: ./gradlew :user-api:compileJava :user-api:test --no-daemon

  publish-image:
    name: Publish user API image
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Checkout manifest repository
        uses: actions/checkout@v4
        with:
          repository: tangerine-map/Hyun-Ji-In-Manifest
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}
          path: manifest

      - name: Update manifest image tag
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          KUSTOMIZATION="manifest/apps/hyunjiin-user-api/overlays/prod/kustomization.yaml"
          sed -i "s/^\([[:space:]]*newTag:\).*/\1 ${SHORT_SHA}/" "${KUSTOMIZATION}"

      - name: Push manifest update
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          cd manifest
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/hyunjiin-user-api/overlays/prod/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Manifest already points to ${SHORT_SHA}."
            exit 0
          fi
          git commit -m "Deploy user API ${SHORT_SHA}"
          git push
